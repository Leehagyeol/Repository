<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>저장소</title>
  <meta name="description" content="링크·사진·메모를 모아 두는 개인 저장소">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <!-- iOS 홈 화면 앱(standalone) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- default: 앱 화면이 상태 표시줄(시계·배터리) 아래에서 시작함.
       black-translucent는 화면이 상태 표시줄 밑까지 올라가 iOS가 그라데이션을 덮어 제목을 가렸음 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="저장소">
  <meta name="theme-color" content="#2F6F68">
  <!-- 모두 상대 경로(./): 장보기 앱(/grocery/)과 섞이지 않게 이 폴더 안 파일만 가리킴 -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./css/style.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <div id="app" class="app">
    <p class="empty">불러오는 중…</p>
  </div>
  <noscript><p class="empty">이 앱은 JavaScript가 켜져 있어야 동작해요.</p></noscript>
</body>
</html>
