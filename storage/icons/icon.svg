<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 바탕: 대표색 청록 (iOS가 모서리를 알아서 둥글게 자름) -->
  <rect width="512" height="512" fill="#2F6F68"/>
  <!-- 서랍장 몸체 -->
  <rect x="120" y="88" width="272" height="344" rx="34" fill="#F6F1E7"/>
  <!-- 가운데 칸 안쪽(열린 서랍 뒤 어두운 틈) -->
  <rect x="140" y="206" width="232" height="104" rx="10" fill="#1E4844"/>
  <!-- 위 서랍 -->
  <rect x="140" y="108" width="232" height="86" rx="14" fill="none" stroke="#2F6F68" stroke-opacity="0.32" stroke-width="6"/>
  <rect x="222" y="141" width="68" height="20" rx="10" fill="#E9B44C"/>
  <!-- 아래 서랍 -->
  <rect x="140" y="328" width="232" height="86" rx="14" fill="none" stroke="#2F6F68" stroke-opacity="0.32" stroke-width="6"/>
  <rect x="222" y="361" width="68" height="20" rx="10" fill="#E9B44C"/>
  <!-- 가운데 서랍: 살짝 앞으로 열림 (조금 넓고 아래로 내려옴 + 그림자) -->
  <rect x="112" y="318" width="288" height="12" rx="6" fill="#000" fill-opacity="0.16"/>
  <rect x="104" y="222" width="304" height="98" rx="16" fill="#FBF8F2" stroke="#2F6F68" stroke-width="6"/>
  <rect x="216" y="261" width="80" height="22" rx="11" fill="#E9B44C"/>
</svg>
